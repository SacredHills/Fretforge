# Builds RAVENYR for macOS, Windows and Linux on every push and on demand.
# Download the results from the run's "Artifacts" section on GitHub (Actions tab).
name: Build

# Compiled objects are cached between runs (ccache on macOS/Linux, sccache on Windows), so a push only recompiles
# what changed. "Run workflow" on the Actions tab can build a single platform.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        options: [ all, macOS, Windows, Linux ]
        default: all

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          all='[{"name":"macOS","os":"macos-latest"},{"name":"Windows","os":"windows-latest"},{"name":"Linux","os":"ubuntu-24.04"}]'
          want="${{ github.event.inputs.platform }}"
          if [ -z "$want" ] || [ "$want" = "all" ]; then m="$all"
          else m=$(echo "$all" | jq -c --arg n "$want" '[.[] | select(.name == $n)]'); fi
          echo "matrix={\"include\":$m}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          # the generator and the checkout path are part of the cached configure state (it holds absolute paths)
          key: juce-8.0.15-${{ matrix.os }}-ninja-${{ github.event.repository.name }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          max-size: 2G

      - name: Visual Studio environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Configure (macOS, universal binary)
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # ASIO: multichannel interfaces (all inputs, ADAT) only show every channel through their ASIO driver.
      # Steinberg's ASIO SDK is available under GPLv3 since 2.3.4 (2025-10).
      - name: ASIO SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\asiosdk.zip"
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca") { throw "ASIO SDK checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\asio"
          $root = (Get-ChildItem "$env:RUNNER_TEMP\asio" -Recurse -Filter iasiodrv.h | Select-Object -First 1).Directory.Parent.FullName
          "ASIO_SDK=$($root -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DFF_ENABLE_ASIO=ON -DFF_ASIO_SDK_DIR="${{ env.ASIO_SDK }}"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFF_BUILD_TEST_PLUGIN=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        shell: bash
        run: |
          t=$(find build -type f \( -name ff_tests -o -name ff_tests.exe \) -path "*Release*" | head -1)
          echo "Running $t"
          # Linux also builds a tiny VST3 effect to test plugin hosting for real
          p=$(find build -type d -name "FF Test Gain.vst3" | head -1)
          if [ -n "$p" ]; then export FF_TEST_VST3="$PWD/$p"; echo "Plugin hosting test with $FF_TEST_VST3"; fi
          "$t"

      - name: Smoke test (macOS) - universal binary and app launch
        if: runner.os == 'macOS'
        run: |
          APP="build/Ravenyr_artefacts/Release/RAVENYR.app"
          BIN="$APP/Contents/MacOS/RAVENYR"
          echo "Architectures: $(lipo -archs "$BIN")"
          lipo -archs "$BIN" | grep -q arm64  || { echo "::error::arm64 slice missing"; exit 1; }
          lipo -archs "$BIN" | grep -q x86_64 || { echo "::error::x86_64 slice missing"; exit 1; }
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleExecutable|LSMinimumSystemVersion|NSMicrophoneUsageDescription"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          launch () {
            local label="$1"; shift
            rm -f ~/Library/Logs/DiagnosticReports/*RAVENYR* 2>/dev/null || true
            "$@" > "run-$label.log" 2>&1 &
            local pid=$!
            sleep 20
            if kill -0 $pid 2>/dev/null; then
              echo "$label: app started and stayed running"
              kill $pid; sleep 2; kill -9 $pid 2>/dev/null || true
            else
              echo "::error::$label: app exited during startup"
              cat "run-$label.log"
              for f in ~/Library/Logs/DiagnosticReports/*RAVENYR*; do echo "== $f"; head -c 20000 "$f"; done
              return 1
            fi
          }
          launch arm64 "$BIN"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            launch x86_64 arch -x86_64 "$BIN"
          else
            echo "Rosetta not available on this runner; x86_64 slice verified by lipo only"
          fi

      - name: Package
        shell: bash
        run: |
          cd build
          if [ "$RUNNER_OS" = "macOS" ]; then
            cpack -C Release -G DragNDrop
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # setup .exe installer (NSIS) and a portable zip
            command -v makensis >/dev/null || [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ] || choco install nsis -y --no-progress
            export PATH="$PATH:/c/Program Files (x86)/NSIS"
            cpack -C Release -G "NSIS;ZIP"
          else
            # .deb (Debian/Ubuntu/Mint), .rpm (Fedora/openSUSE) and a portable .tar.gz
            sudo apt-get install -y rpm
            cpack -G "TGZ;DEB;RPM"
          fi
          ls -la Ravenyr-*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Ravenyr-${{ matrix.name }}
          path: |
            build/Ravenyr-*.dmg
            build/Ravenyr-*.exe
            build/Ravenyr-*.zip
            build/Ravenyr-*.tar.gz
            build/Ravenyr-*.deb
            build/Ravenyr-*.rpm
          if-no-files-found: error

  # Collects the three platform builds into a single zip:
  #   Ravenyr-<version>-all-platforms.zip
  #     macOS/   Ravenyr-x.y.z-Darwin.dmg
  #     Windows/ Ravenyr-x.y.z-win64.exe (installer), Ravenyr-x.y.z-win64.zip (portable)
  #     Linux/   Ravenyr-x.y.z-Linux.deb, .rpm (installers), .tar.gz (portable)
  # Pushing a tag such as v0.3.0 also publishes that zip as a GitHub Release.
  bundle:
    name: All platforms (one zip)
    needs: build
    if: github.event.inputs.platform == '' || github.event.inputs.platform == 'all'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the three builds
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Make one zip
        id: zip
        run: |
          version=$(grep -oP 'project\(Ravenyr VERSION \K[0-9.]+' CMakeLists.txt)
          mkdir -p out/Ravenyr
          mv dist/Ravenyr-macOS   out/Ravenyr/macOS
          mv dist/Ravenyr-Windows out/Ravenyr/Windows
          mv dist/Ravenyr-Linux   out/Ravenyr/Linux
          cat > out/Ravenyr/README.txt <<'TXT'
          RAVENYR STUDIO installers - (c) Sacred Hills Studio
          macOS:   open the .dmg and drag RAVENYR to Applications. First launch: right-click > Open > Open.
          Windows: run Ravenyr-x.y.z-win64.exe (setup with Start menu and desktop shortcuts, uninstall from Settings > Apps).
                   If SmartScreen warns: More info > Run anyway. The .zip is a portable copy: unzip and run "bin\RAVENYR.exe".
          Linux:   Debian / Ubuntu / Mint: sudo apt install ./Ravenyr-x.y.z-Linux.deb
                   Fedora / openSUSE:      sudo dnf install ./Ravenyr-x.y.z-Linux.rpm
                   Then start RAVENYR from the applications menu. The .tar.gz is portable: extract and run "bin/RAVENYR".
                   Uses ALSA (and JACK or PipeWire-JACK for low latency).
          TXT
          name="Ravenyr-${version}-all-platforms.zip"
          (cd out && zip -r "../$name" Ravenyr)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          unzip -l "$name"

      - name: Upload the combined zip
        uses: actions/upload-artifact@v4
        with:
          name: Ravenyr-AllPlatforms
          path: ${{ steps.zip.outputs.name }}
          compression-level: 0   # already a zip

      - name: Publish a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.zip.outputs.name }}" --title "RAVENYR ${GITHUB_REF_NAME}" --generate-notes
