# Builds FretForge Studio for macOS, Windows and Linux on every push and on demand.
# Download the results from the run's "Artifacts" section on GitHub (Actions tab).
name: Build

# Compiled objects are cached between runs (ccache on macOS/Linux, sccache on Windows), so a push only recompiles
# what changed. "Run workflow" on the Actions tab can build a single platform.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        options: [ all, macOS, Windows, Linux ]
        default: all

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          all='[{"name":"macOS","os":"macos-latest"},{"name":"Windows","os":"windows-latest"},{"name":"Linux","os":"ubuntu-24.04"}]'
          want="${{ github.event.inputs.platform }}"
          if [ -z "$want" ] || [ "$want" = "all" ]; then m="$all"
          else m=$(echo "$all" | jq -c --arg n "$want" '[.[] | select(.name == $n)]'); fi
          echo "matrix={\"include\":$m}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ matrix.os }}-ninja   # the generator is part of the cached configure state

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          max-size: 2G

      - name: Visual Studio environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Configure (macOS, universal binary)
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFF_BUILD_TEST_PLUGIN=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        shell: bash
        run: |
          t=$(find build -type f \( -name ff_tests -o -name ff_tests.exe \) -path "*Release*" | head -1)
          echo "Running $t"
          # Linux also builds a tiny VST3 effect to test plugin hosting for real
          p=$(find build -type d -name "FF Test Gain.vst3" | head -1)
          if [ -n "$p" ]; then export FF_TEST_VST3="$PWD/$p"; echo "Plugin hosting test with $FF_TEST_VST3"; fi
          "$t"

      - name: Smoke test (macOS) - universal binary and app launch
        if: runner.os == 'macOS'
        run: |
          APP="build/FretForgeStudio_artefacts/Release/FretForge Studio.app"
          BIN="$APP/Contents/MacOS/FretForge Studio"
          echo "Architectures: $(lipo -archs "$BIN")"
          lipo -archs "$BIN" | grep -q arm64  || { echo "::error::arm64 slice missing"; exit 1; }
          lipo -archs "$BIN" | grep -q x86_64 || { echo "::error::x86_64 slice missing"; exit 1; }
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleExecutable|LSMinimumSystemVersion|NSMicrophoneUsageDescription"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          launch () {
            local label="$1"; shift
            rm -f ~/Library/Logs/DiagnosticReports/*FretForge* 2>/dev/null || true
            "$@" > "run-$label.log" 2>&1 &
            local pid=$!
            sleep 20
            if kill -0 $pid 2>/dev/null; then
              echo "$label: app started and stayed running"
              kill $pid; sleep 2; kill -9 $pid 2>/dev/null || true
            else
              echo "::error::$label: app exited during startup"
              cat "run-$label.log"
              for f in ~/Library/Logs/DiagnosticReports/*FretForge*; do echo "== $f"; head -c 20000 "$f"; done
              return 1
            fi
          }
          launch arm64 "$BIN"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            launch x86_64 arch -x86_64 "$BIN"
          else
            echo "Rosetta not available on this runner; x86_64 slice verified by lipo only"
          fi

      - name: Package
        shell: bash
        run: |
          cd build
          if [ "$RUNNER_OS" = "macOS" ]; then
            cpack -C Release -G DragNDrop
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cpack -C Release -G ZIP
          else
            cpack -G TGZ
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FretForgeStudio-${{ matrix.name }}
          path: |
            build/FretForgeStudio-*.dmg
            build/FretForgeStudio-*.zip
            build/FretForgeStudio-*.tar.gz
          if-no-files-found: error

  # Collects the three platform builds into a single zip:
  #   FretForgeStudio-<version>-all-platforms.zip
  #     macOS/   FretForgeStudio-x.y.z-Darwin.dmg
  #     Windows/ FretForgeStudio-x.y.z-win64.zip
  #     Linux/   FretForgeStudio-x.y.z-Linux.tar.gz
  # Pushing a tag such as v0.3.0 also publishes that zip as a GitHub Release.
  bundle:
    name: All platforms (one zip)
    needs: build
    if: github.event.inputs.platform == '' || github.event.inputs.platform == 'all'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the three builds
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Make one zip
        id: zip
        run: |
          version=$(grep -oP 'project\(FretForgeStudio VERSION \K[0-9.]+' CMakeLists.txt)
          mkdir -p out/FretForgeStudio
          mv dist/FretForgeStudio-macOS   out/FretForgeStudio/macOS
          mv dist/FretForgeStudio-Windows out/FretForgeStudio/Windows
          mv dist/FretForgeStudio-Linux   out/FretForgeStudio/Linux
          cat > out/FretForgeStudio/README.txt <<'TXT'
          FretForge Studio builds
          macOS:   open the .dmg and drag the app to Applications. First launch: right-click > Open > Open.
          Windows: unzip and run "bin\FretForge Studio.exe". If SmartScreen warns: More info > Run anyway.
          Linux:   extract the .tar.gz and run "bin/FretForge Studio".
                   Needs ALSA (and JACK or PipeWire-JACK for low latency), FreeType, Fontconfig and X11 libraries.
          TXT
          name="FretForgeStudio-${version}-all-platforms.zip"
          (cd out && zip -r "../$name" FretForgeStudio)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          unzip -l "$name"

      - name: Upload the combined zip
        uses: actions/upload-artifact@v4
        with:
          name: FretForgeStudio-AllPlatforms
          path: ${{ steps.zip.outputs.name }}
          compression-level: 0   # already a zip

      - name: Publish a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.zip.outputs.name }}" --title "FretForge Studio ${GITHUB_REF_NAME}" --generate-notes
